name: Deploy to GitHub Pages

# Préview du site sur GitHub Pages :
# https://pierreleripoll.github.io/faiscommecheztoi/
# Se déclenche sur la branche dev (préview « stable ») et sur la branche de
# draft pour voir le résultat sans attendre la création de dev.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - claude/faiscommecheztoi-site-draft-emur0m

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Active GitHub Pages (source: Actions) si ce n'est pas déjà fait.
      - uses: actions/configure-pages@v5
        with:
          enablement: enabled

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Le site est servi sous /faiscommecheztoi/ sur *.github.io.
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /faiscommecheztoi/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
