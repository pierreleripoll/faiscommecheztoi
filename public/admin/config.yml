# Sveltia CMS — backend GitHub avec OAuth via le worker sveltia-cms-auth
# (Cloudflare). Le worker refuse toute origine absente de sa variable
# ALLOWED_DOMAINS : y ajouter faiscommecheztoi.ch (et localhost pour le dev), sinon /admin affiche « Votre domaine n'est pas autorisé à
# utiliser l'authentificateur ». Les éditeur·ices ont besoin d'un compte GitHub
# avec accès en écriture au repo (voir README, section « Admin »).
#
# L'interface s'appuie sur des options récentes de Sveltia (≥ 0.186, août 2026) :
# `singletons` (sections en accès direct dans la colonne de gauche), `reorder`
# (réorganisation des artistes par glisser-déposer, groupée par édition),
# `view_filters`/`view_groups` (la liste s'ouvre sur l'édition courante),
# `thumbnail` (vignettes dans les listes). Les items des listes (photos, logos,
# affiches, horaires) se réordonnent aussi en glissant leur poignée ≡ — sans
# option à poser, c'est le comportement par défaut du widget `list` depuis
# sveltia/sveltia-cms#929 (commit b21e728, 25.08.2026, première version après
# la 0.198.0) ; au doigt et au clavier, les flèches restent. /admin/index.html
# charge la dernière version depuis unpkg — ne pas figer une version antérieure.
# Le champ `horaire` des fiches artistes est à nous : `CMS.registerFieldType`
# dans /admin/horaire.js (Sveltia ≥ 0.198 pour `entry` et `isValid`).
backend:
  name: github
  repo: pierreleripoll/faiscommecheztoi
  branch: dev
  base_url: https://sveltia-cms-auth.pierreripoll13-d89.workers.dev

site_url: https://faiscommecheztoi.ch
app_title: "Admin — Fais comme chez toi"

media_folder: public/uploads
public_folder: /uploads

collections:
  # Un fichier par artiste. Ces fiches s'affichent dans la section « Artistes »,
  # filtrées par l'année. Les champs machine des photos
  # (width/height/ratio/thumbhash) ne sont pas déclarés : le script
  # update-images les ajoute après coup et Sveltia préserve les clés inconnues.
  #
  # À CHAQUE NOUVELLE ÉDITION : ajouter un filtre « Édition <année> » ci-dessous
  # et déplacer `default` dessus, pour que la liste s'ouvre sur l'édition en
  # cours. (Penser aussi à créer l'entrée de l'année dans « Éditions ».)
  - name: "programme"
    label: "Artistes"
    label_singular: "fiche artiste"
    icon: "theater_comedy"
    folder: "content/programme"
    create: true
    slug: "{{order}}.{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "name"
    summary: "{{year}} — {{name}} — {{title}}"
    thumbnail: "photos.*.src"
    sortable_fields:
      fields: ["order", "name", "year"]
      default:
        field: "order"
    view_filters:
      filters:
        - { name: "2026", label: "Édition 2026", field: "year", pattern: "2026" }
        - { name: "2025", label: "Édition 2025", field: "year", pattern: "2025" }
        - { name: "2024", label: "Édition 2024", field: "year", pattern: "2024" }
        - { name: "2023", label: "Édition 2023", field: "year", pattern: "2023" }
        - { name: "2022", label: "Édition 2022", field: "year", pattern: "2022" }
        - { name: "2021", label: "Édition 2021", field: "year", pattern: "2021" }
      default: "2026"
    view_groups:
      groups:
        - { name: "year", label: "Édition", field: "year" }
      default: "year"
    # Glisser-déposer (bouton « Réorganiser » de la liste) : renumérote le champ
    # `order` édition par édition, à partir de 1. Les préfixes numériques des
    # noms de fichiers ne sont pas renommés — seul le champ fait foi.
    reorder:
      group: "year"
    fields:
      - { label: "Artiste", name: "name", widget: "string" }
      - label: "Ordre"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1
        hint: "Ordre d'affichage — les artistes sont classés par première représentation. Modifiable aussi par glisser-déposer : bouton « Réorganiser » en haut de la liste."
      - label: "Année"
        name: "year"
        widget: "string"
        default: "2026"
        hint: "L'édition à laquelle la fiche appartient — elle apparaît sous cet onglet dans la section Artistes."
      - { label: "Titre du spectacle", name: "title", widget: "string" }
      - { label: "Durée", name: "duration", widget: "string", hint: "Ex. 35'" }
      - { label: "Format", name: "format", widget: "string", hint: "Ex. étape de travail/work in progress" }
      - label: "Collaboration"
        name: "collaboration"
        widget: "string"
        required: false
        hint: "Ex. Collaboration avec L'Oblique. Laisser vide si le projet ne vient pas d'un partenariat."
      - label: "Avec"
        name: "with"
        widget: "string"
        required: false
        hint: "Le reste de l'équipe, sans le mot « Avec »."
      - { label: "Lieu", name: "venue", widget: "string", hint: "Ex. Sion, Théâtre de Valère" }
      - label: "Horaires"
        name: "dates"
        widget: "list"
        # Champ maison (horaire.js) : on tape la date comme on veut ou on la
        # choisit au calendrier, le champ l'écrit « Je 08.10, 19:05 » — la
        # seule forme que la grille horaire sait lire — et refuse une date qui
        # n'existe pas ou qui tombe loin des autres soirs de l'édition.
        field: { label: "Date", name: "date", widget: "horaire" }
        hint: "Une ligne par représentation. Tape « 8.10 19h05 » ou clique le calendrier : la date se remet au propre toute seule (Je 08.10, 19:05). L'année est celle du champ Année."
      - { label: "École", name: "school", widget: "string" }
      - label: "Joué aussi ailleurs"
        name: "also"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Festival", name: "festival", widget: "string" }
          - { label: "Lieu", name: "venue", widget: "string" }
          - label: "Horaires"
            name: "dates"
            widget: "list"
            # Un autre festival, à une autre période : même champ, sans le
            # contrôle de proximité avec les soirs de l'édition.
            field: { label: "Date", name: "date", widget: "horaire", plausibilite: false }
            hint: "Même écriture que les horaires de l'édition (ex. Sa 19.09, 20:00)."
      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.alt}}"
        thumbnail: "src"
        hint: "La première photo est celle qui s'affiche ; les suivantes se feuillettent sur la carte. Pour changer l'ordre, glisser une photo par sa poignée ≡ (ou les flèches sur tablette)."
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Texte alternatif", name: "alt", widget: "string", required: false }
          - { label: "Crédit photo", name: "credit", widget: "string", required: false }
      - { label: "Biographie", name: "body", widget: "markdown" }

  # Une entrée par édition du festival : l'année (qui crée l'onglet dans la
  # section Artistes) et ses affiches.
  - name: "artistes"
    label: "Éditions"
    label_singular: "édition"
    icon: "calendar_month"
    folder: "content/artistes"
    create: true
    slug: "{{year}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "year"
    summary: "Édition {{year}}"
    thumbnail: "posters.*.src"
    sortable_fields:
      fields: ["year"]
      default:
        field: "year"
        direction: "descending"
    fields:
      - { label: "Année", name: "year", widget: "string" }
      - label: "Affiches"
        name: "posters"
        widget: "list"
        collapsed: true
        summary: "{{fields.credit}}"
        thumbnail: "src"
        hint: "Les affiches s'affichent dans l'ordre de la liste — glisser par la poignée ≡ pour le changer."
        fields:
          - { label: "Affiche", name: "src", widget: "image" }
          - { label: "Crédit (graphiste)", name: "credit", widget: "string", required: false }

  - name: "partenariats"
    label: "Partenariats"
    label_singular: "partenariat"
    icon: "handshake"
    folder: "content/partenariats"
    create: true
    slug: "{{order}}.{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields:
      fields: ["order", "title"]
      default:
        field: "order"
    reorder: true
    fields:
      - { label: "Nom", name: "title", widget: "string" }
      - { label: "Ordre", name: "order", widget: "number", value_type: "int", default: 1, hint: "Modifiable aussi par glisser-déposer : bouton « Réorganiser » en haut de la liste." }
      - { label: "Texte", name: "body", widget: "markdown" }

# Les sections de la page, chacune en accès direct dans la colonne de gauche
# (groupe « Fichiers »), dans l'ordre où elles apparaissent sur le site.
singletons:
  - name: "hero"
    label: "Intro (haut de page)"
    icon: "waving_hand"
    file: "content/hero.md"
    fields:
      - label: "Texte d'intro"
        name: "body"
        widget: "markdown"
      - label: "Photos"
        name: "photos"
        widget: "list"
        collapsed: true
        summary: "{{fields.alt}}"
        thumbnail: "src"
        hint: "Les photos défilent toutes seules en haut de page, dans l'ordre de la liste. Pour changer l'ordre, glisser une photo par sa poignée ≡ (ou les flèches sur tablette). Format paysage, toutes au même format de préférence."
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Texte alternatif", name: "alt", widget: "string", required: false }
          - { label: "Crédit photo", name: "credit", widget: "string", required: false, hint: "S'affiche sous la photo." }

  - name: "appel"
    label: "Nuage « Appel à projet »"
    icon: "cloud"
    file: "content/appel.md"
    fields:
      - { label: "Visible", name: "visible", widget: "boolean", default: true }
      - { label: "Texte", name: "label", widget: "string" }
      - label: "Lien"
        name: "url"
        widget: "string"
        hint: "URL ou ancre (ex. #participer, https://…, mailto:…)"

  - name: "infos"
    label: "Infos pratiques"
    icon: "info"
    file: "content/infos.md"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Texte", name: "body", widget: "markdown" }

  - name: "participer"
    label: "Participer"
    icon: "edit_note"
    file: "content/participer.md"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Texte", name: "body", widget: "markdown" }

  - name: "team"
    label: "Contact & Team"
    icon: "groups"
    file: "content/team.md"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Texte", name: "body", widget: "markdown" }

  - name: "soutiens"
    label: "Soutiens (logos)"
    icon: "volunteer_activism"
    file: "content/soutiens.md"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - label: "Logos"
        name: "logos"
        widget: "list"
        collapsed: true
        summary: "{{fields.alt}}"
        thumbnail: "src"
        hint: "L'ordre de la liste est l'ordre d'affichage — glisser un logo par sa poignée ≡ pour le changer."
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Nom", name: "alt", widget: "string" }
          - { label: "Lien", name: "url", widget: "string", required: false }

  - name: "pied"
    label: "Pied de page"
    icon: "copyright"
    file: "content/pied.md"
    fields:
      - { label: "Ligne", name: "ligne", widget: "string", hint: "Ex. Du 7 au 10 octobre 2026, au Spot à Sion — entrée libre" }
