# Sveltia CMS — backend GitHub avec OAuth via le worker sveltia-cms-auth
# (Cloudflare). Le worker refuse toute origine absente de sa variable
# ALLOWED_DOMAINS : y ajouter faiscommecheztoi.ch (et localhost pour le dev), sinon /admin affiche « Votre domaine n'est pas autorisé à
# utiliser l'authentificateur ». Les éditeur·ices ont besoin d'un compte GitHub
# avec accès en écriture au repo (voir README, section « Admin »).
backend:
  name: github
  repo: pierreleripoll/faiscommecheztoi
  branch: dev
  base_url: https://sveltia-cms-auth.pierreripoll13-d89.workers.dev

site_url: https://faiscommecheztoi.ch

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: "pages"
    label: "Sections de la page"
    files:
      - name: "hero"
        label: "Intro (haut de page)"
        file: "content/hero.md"
        fields:
          - label: "Texte d'intro"
            name: "body"
            widget: "markdown"
          - label: "Photo"
            name: "photo"
            widget: "object"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Texte alternatif", name: "alt", widget: "string", required: false }

      - name: "appel"
        label: "Nuage « Appel à projet »"
        file: "content/appel.md"
        fields:
          - { label: "Visible", name: "visible", widget: "boolean", default: true }
          - { label: "Texte", name: "label", widget: "string" }
          - label: "Lien"
            name: "url"
            widget: "string"
            hint: "URL ou ancre (ex. #participer, https://…, mailto:…)"

      - name: "infos"
        label: "Infos pratiques"
        file: "content/infos.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "body", widget: "markdown" }

      - name: "participer"
        label: "Participer"
        file: "content/participer.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "body", widget: "markdown" }

      - name: "team"
        label: "Contact & Team"
        file: "content/team.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "body", widget: "markdown" }

      - name: "soutiens"
        label: "Soutiens (logos)"
        file: "content/soutiens.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - label: "Logos"
            name: "logos"
            widget: "list"
            collapsed: true
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Nom", name: "alt", widget: "string" }
              - { label: "Lien", name: "url", widget: "string", required: false }

  - name: "artistes"
    label: "Artistes (par année)"
    folder: "content/artistes"
    create: true
    slug: "{{year}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "year"
    summary: "{{year}}"
    sortable_fields: ["year"]
    fields:
      - { label: "Année", name: "year", widget: "string" }
      - label: "Affiches"
        name: "posters"
        widget: "list"
        collapsed: true
        summary: "{{fields.credit}}"
        fields:
          - { label: "Affiche", name: "src", widget: "image" }
          - { label: "Crédit (graphiste)", name: "credit", widget: "string", required: false }

  # Un fichier par artiste. Ces fiches s'affichent dans la section « Artistes »,
  # filtrées par l'année. Les champs machine des photos
  # (width/height/ratio/thumbhash) ne sont pas déclarés : le script
  # update-images les ajoute après coup et Sveltia préserve les clés inconnues.
  - name: "programme"
    label: "Artistes de l'édition"
    folder: "content/programme"
    create: true
    slug: "{{order}}.{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "name"
    summary: "{{order}}. {{name}} — {{title}}"
    sortable_fields: ["order", "name"]
    fields:
      - { label: "Artiste", name: "name", widget: "string" }
      - label: "Ordre"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1
        hint: "Ordre d'affichage — les artistes sont classés par première représentation."
      - label: "Année"
        name: "year"
        widget: "string"
        default: "2026"
        hint: "L'édition à laquelle la fiche appartient — elle apparaît sous cet onglet dans la section Artistes."
      - { label: "Titre du spectacle", name: "title", widget: "string" }
      - { label: "Durée", name: "duration", widget: "string", hint: "Ex. 35’" }
      - { label: "Format", name: "format", widget: "string", hint: "Ex. étape de travail/work in progress" }
      - label: "Collaboration"
        name: "collaboration"
        widget: "string"
        required: false
        hint: "Ex. Collaboration avec L'Oblique. Laisser vide si le projet ne vient pas d'un partenariat."
      - label: "Avec"
        name: "with"
        widget: "string"
        required: false
        hint: "Le reste de l'équipe, sans le mot « Avec »."
      - { label: "Lieu", name: "venue", widget: "string", hint: "Ex. Sion, Théâtre de Valère" }
      - label: "Horaires"
        name: "dates"
        widget: "list"
        field: { label: "Date", name: "date", widget: "string" }
        hint: "Ex. Je 08.10, 19:05"
      - { label: "École", name: "school", widget: "string" }
      - label: "Joué aussi ailleurs"
        name: "also"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Festival", name: "festival", widget: "string" }
          - { label: "Lieu", name: "venue", widget: "string" }
          - label: "Horaires"
            name: "dates"
            widget: "list"
            field: { label: "Date", name: "date", widget: "string" }
      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.src}}"
        hint: "La première photo est celle qui s'affiche ; les suivantes se feuillettent sur la carte."
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Texte alternatif", name: "alt", widget: "string", required: false }
          - { label: "Crédit photo", name: "credit", widget: "string", required: false }
      - { label: "Biographie", name: "body", widget: "markdown" }

  - name: "partenariats"
    label: "Partenariats"
    folder: "content/partenariats"
    create: true
    slug: "{{order}}.{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    fields:
      - { label: "Nom", name: "title", widget: "string" }
      - { label: "Ordre", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Texte", name: "body", widget: "markdown" }
