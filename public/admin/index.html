<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — Fais comme chez toi</title>
    <style>
      /* Bouton d'aide flottant + panneau latéral qui charge aide.html.
         Indépendant de Sveltia : rien à brancher dans le CMS, juste du HTML
         posé par-dessus. Le coin bas-droit est libre sur tous ses écrans. */
      #fcct-aide-btn {
        position: fixed; right: 18px; bottom: 18px; z-index: 2147483000;
        width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
        background: #1565c0; color: #fff; font: 700 19px/40px Georgia, "Times New Roman", serif;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
      }
      #fcct-aide-btn:hover { background: #0d47a1; }
      #fcct-aide-btn:focus-visible { outline: 3px solid #90caf9; outline-offset: 2px; }
      #fcct-aide {
        z-index: 2147483001; margin: 0; padding: 0; border: 0;
        inset: 0 0 0 auto; width: min(620px, 100vw); height: 100vh; max-height: 100vh; max-width: 100vw;
        background: #f7f7f8; box-shadow: -4px 0 24px rgba(0, 0, 0, .25);
        display: none; flex-direction: column;
      }
      #fcct-aide[open] { display: flex; }
      #fcct-aide::backdrop { background: rgba(0, 0, 0, .35); }
      #fcct-aide header {
        display: flex; align-items: center; gap: 12px; padding: 10px 14px;
        border-bottom: 1px solid #dcdce2; background: #fff;
        font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c1c21;
      }
      #fcct-aide header span { flex: 1; }
      #fcct-aide header a { font-weight: 400; color: #1565c0; font-size: 13px; }
      #fcct-aide header button {
        border: 0; background: none; cursor: pointer; font-size: 22px; line-height: 1; color: #5f5f6b; padding: 2px 6px;
      }
      #fcct-aide iframe { flex: 1; border: 0; width: 100%; }
      @media (prefers-color-scheme: dark) {
        #fcct-aide { background: #1b1b1f; }
        #fcct-aide header { background: #242429; border-color: #3a3a42; color: #ececf1; }
        #fcct-aide header a { color: #7fb3f0; }
      }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS (successeur drop-in de Decap/Netlify CMS).
         Auth : GitHub OAuth via le worker sveltia-cms-auth (voir config.yml). -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <!-- Aperçu en direct : le volet de droite devient une iframe du site,
         mise à jour à chaque frappe (voir le fichier). -->
    <script src="apercu.js"></script>
    <!-- Champ « horaire » des fiches artistes : saisie libre remise au propre,
         calendrier, et refus des dates impossibles (voir le fichier). -->
    <script src="horaire.js"></script>

    <button id="fcct-aide-btn" type="button" title="Aide : comment modifier le site" aria-label="Ouvrir l'aide">i</button>
    <dialog id="fcct-aide" aria-label="Aide de l'admin">
      <header>
        <span>Aide — comment modifier le site</span>
        <a href="/admin/aide.html?v=2" target="_blank" rel="noopener">Ouvrir dans un onglet ↗</a>
        <button type="button" id="fcct-aide-close" aria-label="Fermer l'aide">×</button>
      </header>
      <!-- src posé à l'ouverture : la page d'aide ne se charge pas tant qu'on n'en a pas besoin.
           Chemin absolu : en relatif, une base perdue enverrait « aide.html » à la
           racine, que le .htaccess redirige vers le site, et c'est le site qui
           s'affichait dans ce panneau (vu sur Safari, 01.09.2026). Le paramètre
           de version contourne aussi une redirection 301 gardée en cache par
           le navigateur pour cette adresse. -->
      <iframe title="Aide" data-src="/admin/aide.html?v=2"></iframe>
    </dialog>
    <script>
      (function () {
        var dlg = document.getElementById('fcct-aide');
        var frame = dlg.querySelector('iframe');
        document.getElementById('fcct-aide-btn').addEventListener('click', function () {
          if (!frame.src) frame.src = frame.getAttribute('data-src');
          dlg.showModal();
        });
        document.getElementById('fcct-aide-close').addEventListener('click', function () { dlg.close(); });
        // Clic sur le fond sombre : fermer.
        dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
      })();
    </script>
  </body>
</html>
